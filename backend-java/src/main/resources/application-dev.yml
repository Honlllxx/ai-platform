# 开发环境配置
spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/platform_db
    username: platform
    password: platform123
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000

  data:
    redis:
      host: localhost
      port: 6379
      password: redis123
      database: 0
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 2

# MinIO
minio:
  endpoint: http://localhost:9000
  access-key: minioadmin
  secret-key: minioadmin123
  bucket: documents

# RocketMQ (Phase 1 只声明不启用)
rocketmq:
  name-server: localhost:9876
  producer:
    group: platform-producer-group
    send-message-timeout: 10000
  consumer:
    group: platform-consumer-group

# 日志级别
logging:
  level:
    com.platform: DEBUG
    org.springframework.security: INFO
    com.baomidou.mybatisplus: DEBUG
