# =============================================================================
# Nginx API Gateway — unified entry point for AI Platform
# =============================================================================
# Routes:
#   /api/ai/*       → Python:8000  (AI processing pipeline)
#   /api/prompt/*   → Python:8000  (prompt management)
#   /api/finetune/* → Python:8000  (fine-tuning tasks)
#   /api/models/*   → Python:8000  (model assets)
#   /api/*          → Java:8080    (business REST API)
# =============================================================================

upstream java_backend {
    server backend-java:8080;
}

upstream python_ai {
    server backend-python:8000;
}

server {
    listen 80;
    server_name localhost;

    client_max_body_size 100M;
    proxy_read_timeout 300s;
    proxy_connect_timeout 30s;
    proxy_send_timeout 300s;

    # ── AI Processing ── Python FastAPI ────────────────────────────
    location /api/ai/ {
        proxy_pass http://python_ai;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # ── Prompt Management ── Python FastAPI ────────────────────────
    location /api/prompt/ {
        proxy_pass http://python_ai;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Fine-tuning Tasks ── Python FastAPI ────────────────────────
    location /api/finetune/ {
        proxy_pass http://python_ai;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Model Assets ── Python FastAPI ─────────────────────────────
    location /api/models/ {
        proxy_pass http://python_ai;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Business REST API ── Java Spring Boot ──────────────────────
    location /api/ {
        proxy_pass http://java_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Health check ───────────────────────────────────────────────
    location /health {
        return 200 '{"status":"ok","service":"nginx-gateway"}';
        add_header Content-Type application/json;
    }
}
