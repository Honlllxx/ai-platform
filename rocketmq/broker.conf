# RocketMQ Broker Configuration
# Apache RocketMQ 5.3.1

# NameServer address
namesrvAddr = rocketmq-namesrv:9876

# Broker identity
brokerClusterName = platform-cluster
brokerName = platform-broker
brokerId = 0

# Listen ports
listenPort = 10911

# Storage
storePathRootDir = /home/rocketmq/store
storePathCommitLog = /home/rocketmq/store/commitlog
storePathConsumerQueue = /home/rocketmq/store/consumequeue

# Auto create topic and subscription group (dev only)
autoCreateTopicEnable = true
autoCreateSubscriptionGroup = true

# Delete expired files
fileReservedTime = 72
deleteWhen = 04
